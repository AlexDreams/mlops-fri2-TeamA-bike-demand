# Hypothesis: deeper trees capture hour x workingday interactions better than
# max_depth 10; may improve MAE, at a latency and size cost the gate checks.
data: data/raw/hour.csv
features:
  - season
  - yr
  - mnth
  - hr
  - holiday
  - weekday
  - workingday
  - weathersit
  - temp
  - atemp
  - hum
  - windspeed
model:
  n_estimators: 100
  max_depth: 20
  min_samples_leaf: 2
  random_state: 42
  n_jobs: 1
