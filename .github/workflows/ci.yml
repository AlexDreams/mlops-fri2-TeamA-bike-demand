name: Week 1 checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: bike-demand

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.23"
          python-version: "3.12"

      - run: uv sync --locked
      - run: uv run --locked python -m bike_demand.preflight
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      # The accepted model bundle lives in Cloud Storage, which this runner
      # cannot read (no keyless GCP login). Cloud Build runs these tests after
      # fetching it.
      - name: Run tests that do not need the accepted bundle
        run: uv run --locked pytest -q --strict-markers -m "not accepted_model"
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The model is not in Git; build the code-and-dependencies stage only.
      # Cloud Build builds the full "service" stage after fetching the model.
      - name: Build Docker image (app stage, no model)
        run: docker build --target app -t bike-demand:ci ./bike-demand