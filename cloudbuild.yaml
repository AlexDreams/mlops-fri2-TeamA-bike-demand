
steps:
  # The accepted model is not in Git. Download the bundle named by the reviewed
  # registry/accepted.json and refuse to continue unless both digests match.
  - id: "Fetch accepted bundle"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    dir: "bike-demand"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        uri=$$(python3 -c 'import json; print(json.load(open("registry/accepted.json"))["uri"])')
        mkdir -p artifacts
        gcloud storage cp "$${uri}model.joblib" "$${uri}model-metadata.json" artifacts/
        python3 -c '
        import hashlib, json
        accepted = json.load(open("registry/accepted.json"))
        for name, key in (("model.joblib", "model_sha256"), ("model-metadata.json", "metadata_sha256")):
            digest = hashlib.sha256(open("artifacts/" + name, "rb").read()).hexdigest()
            if digest != accepted[key]:
                raise SystemExit(name + ": digest " + digest + " != " + accepted[key])
        print("Accepted bundle verified:", accepted["model_version"])
        '

  # Same checks as .github/workflows/ci.yml. Cloud Build stops at the first
  # failing step, so a red check means no image is built, pushed or deployed.
  - id: "Run blocking checks"
    name: "python:3.12-slim"
    dir: "bike-demand"
    entrypoint: "bash"
    env:
      - "UV_PYTHON_DOWNLOADS=never"
      - "DEBIAN_FRONTEND=noninteractive"
    args:
      - "-ceu"
      - |
        # tracking.py calls the git binary; the GitHub runner and the
        # Dockerfile both have it, python:3.12-slim does not.
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends git
        pip install --no-cache-dir uv==0.12.23
        uv sync --locked
        uv run --locked python -m bike_demand.preflight
        uv run --locked ruff check .
        uv run --locked ruff format --check .
        uv run --locked pytest -q --strict-markers

  - id: "Build Docker image"
    name: "gcr.io/cloud-builders/docker"
    dir: "bike-demand"
    args:
      - "build"
      - "--build-arg"
      - "BIKE_DEMAND_REVISION=$COMMIT_SHA"
      - "-t"
      - "europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mlops-fri2-teama-bike-demand:$COMMIT_SHA"
      - "-f"
      - "Dockerfile"
      - "."

  - id: "Push Docker image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mlops-fri2-teama-bike-demand:$COMMIT_SHA"

  - id: "Deploy to Cloud Run"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "mlops-fri2-teama-bike-demand"
      - "--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mlops-fri2-teama-bike-demand:$COMMIT_SHA"
      - "--region=europe-west1"
      - "--project=$PROJECT_ID"
      - "--quiet"

images:
  - "europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mlops-fri2-teama-bike-demand:$COMMIT_SHA"

timeout: "1200s"

options:
  logging: CLOUD_LOGGING_ONLY