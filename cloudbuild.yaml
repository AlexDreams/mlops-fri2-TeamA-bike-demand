
# Runs on every push to main (Cloud Build trigger). A failing step stops the build:
# nothing after it runs, and the previously verified revision keeps serving.
steps:
  # The accepted model is not in Git. Read the reviewed registry/accepted.json
  # (Python image), then download that bundle and refuse to continue unless both
  # digests match (gcloud image; it has no python3 on its PATH).
  # _EXPECTED_MODEL_OVERRIDE is empty on normal runs; setting it to a wrong value
  # on a manual run demonstrates that a failed identity check deploys nothing.
  - id: "Read accepted pointer"
    name: "python:3.12-slim"
    dir: "bike-demand"
    entrypoint: "python3"
    args:
      - "-c"
      - |
        import json, pathlib
        accepted = json.load(open("registry/accepted.json"))
        workspace = pathlib.Path("/workspace")
        (workspace / "accepted-uri.txt").write_text(accepted["uri"])
        (workspace / "accepted.sha256").write_text(
            accepted["model_sha256"] + "  artifacts/model.joblib\n"
            + accepted["metadata_sha256"] + "  artifacts/model-metadata.json\n",
            newline="\n",
        )
        expected = "$_EXPECTED_MODEL_OVERRIDE" or accepted["model_version"]
        (workspace / "expected-model.txt").write_text(expected)
        (workspace / "expected-model-sha256.txt").write_text(accepted["model_sha256"])
        print("Accepted version:", accepted["model_version"], "| expected live:", expected)

  - id: "Fetch accepted bundle"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    dir: "bike-demand"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        uri=$$(cat /workspace/accepted-uri.txt)
        mkdir -p artifacts
        gcloud storage cp "$${uri}model.joblib" "$${uri}model-metadata.json" artifacts/
        sha256sum -c /workspace/accepted.sha256

  # Same checks as .github/workflows/ci.yml, plus the accepted-model regression
  # test that GitHub Actions cannot run (it cannot read the bucket).
  - id: "Run blocking checks"
    name: "python:3.12-slim"
    dir: "bike-demand"
    entrypoint: "bash"
    env:
      - "UV_PYTHON_DOWNLOADS=never"
      - "DEBIAN_FRONTEND=noninteractive"
    args:
      - "-ceu"
      - |
        # tracking.py calls the git binary; the GitHub runner and the
        # Dockerfile both have it, python:3.12-slim does not.
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends git
        pip install --no-cache-dir uv==0.12.23
        uv sync --locked
        uv run --locked python -m bike_demand.preflight
        uv run --locked ruff check .
        uv run --locked ruff format --check .
        uv run --locked pytest -q --strict-markers
        # Linux side of the cross-OS tolerance measurement (README, tolerance).
        uv run --locked python scripts/measure_prediction_drift.py

  - id: "Build Docker image"
    name: "gcr.io/cloud-builders/docker"
    dir: "bike-demand"
    args:
      - "build"
      - "--build-arg"
      - "BIKE_DEMAND_REVISION=$COMMIT_SHA"
      - "-t"
      - "europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mlops-fri2-teama-bike-demand:$COMMIT_SHA"
      - "-f"
      - "Dockerfile"
      - "."

  # Run the image just built, inside the build, and apply the Lab 5 identity check
  # to it before it is pushed or deployed. No identity token is needed: the
  # container is reached directly on the build network. (Cloud Build cannot mint
  # identity tokens for the private Cloud Run URL with the team's current IAM.)
  - id: "Start built image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "run"
      - "--detach"
      - "--name=built-service"
      - "--network=cloudbuild"
      - "europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mlops-fri2-teama-bike-demand:$COMMIT_SHA"

  - id: "Verify built image"
    name: "python:3.12-slim"
    dir: "bike-demand"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        for attempt in $$(seq 1 30); do
          if python3 scripts/verify_deployment.py \
              --url http://built-service:8000 \
              --expected-model "$$(cat /workspace/expected-model.txt)" \
              --expected-model-sha256 "$$(cat /workspace/expected-model-sha256.txt)" \
              --expected-revision "$COMMIT_SHA"; then
            exit 0
          fi
          sleep 2
        done
        echo "Image check failed: nothing is pushed or deployed; traffic stays on the previous revision."
        exit 1

  - id: "Push Docker image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mlops-fri2-teama-bike-demand:$COMMIT_SHA"

  # New revision with 0% traffic. If it cannot start, this step fails and the
  # previous revision keeps 100% of traffic.
  - id: "Deploy new revision without traffic"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "mlops-fri2-teama-bike-demand"
      - "--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mlops-fri2-teama-bike-demand:$COMMIT_SHA"
      - "--region=europe-west1"
      - "--project=$PROJECT_ID"
      - "--no-traffic"
      - "--tag=c-$SHORT_SHA"
      - "--quiet"

  # Only reached when the image check passed and the revision started.
  - id: "Route traffic to verified revision"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "gcloud"
    args:
      - "run"
      - "services"
      - "update-traffic"
      - "mlops-fri2-teama-bike-demand"
      - "--to-tags=c-$SHORT_SHA=100"
      - "--region=europe-west1"
      - "--project=$PROJECT_ID"
      - "--quiet"

images:
  - "europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mlops-fri2-teama-bike-demand:$COMMIT_SHA"

substitutions:
  _EXPECTED_MODEL_OVERRIDE: ""

timeout: "1800s"

options:
  logging: CLOUD_LOGGING_ONLY
